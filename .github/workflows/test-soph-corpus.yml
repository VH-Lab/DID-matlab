name: Soph (Griswold) corpus discovery

# On-demand discovery run for the Soph (Griswold) corpus -- the largest
# single-corpus fixture (~446 MB, ~101k v1 documents), which test-code.yml
# skips on every PR (testCorpusSoph is opt-in via DID_RUN_SOPH_TEST). This
# workflow sets DID_RUN_SOPH_TEST=1 and runs ONLY testCorpusSoph so we can
# verify the Griswold corpus converts to V_zeta with no orphan docs / no
# unexpected quarantine, without re-running the ~1h50m full corpus suite.
#
# Mirrors test-code.yml's environment (sibling did-schema checkout on the
# matching V_zeta branch + assembled V_zeta schema set). Revert the
# did-schema ref fallback to `main` once the V_zeta branch merges.

on:
  # workflow_dispatch is only exposed for workflows on the default branch, so
  # while this lives on the feature branch it is driven by a scoped push
  # trigger: it re-runs only when the conversion engine, the Soph test, or this
  # workflow change -- not on unrelated pushes. Once merged to the default
  # branch, the workflow_dispatch entry below becomes the on-demand trigger and
  # the push block can be dropped.
  push:
    branches: [claude/did-schema-v-zeta-johipc]
    paths:
      - 'src/did/+did2/+convert/**'
      - 'tests/+did2/+unittest/testCorpusSoph.m'
      - 'tests/+did2/+unittest/+helpers/**'
      - '.github/workflows/test-soph-corpus.yml'
  workflow_dispatch:
    inputs:
      did_schema_ref:
        description: 'did-schema branch (V_zeta line)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soph_corpus:
    name: Soph (Griswold) corpus discovery
    runs-on: ubuntu-latest
    env:
      DID_SCHEMA_REF: ${{ inputs.did_schema_ref || github.ref_name || 'main' }}
      DID_RUN_SOPH_TEST: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_zeta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ env.DID_SCHEMA_REF }}
          path: did-schema

      - name: Assemble V_zeta schema set (stable + draft)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/zeta-schemas"
          cp did-schema/schemas/V_zeta/stable/*.json "${GITHUB_WORKSPACE}/zeta-schemas/"
          cp did-schema/schemas/V_zeta/draft/*.json  "${GITHUB_WORKSPACE}/zeta-schemas/"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/zeta-schemas" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run the Soph corpus discovery test
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            results = runtests('did2.unittest.testCorpusSoph');
            disp(table(results));
            assertSuccess(results);

      - name: Upload Soph corpus discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soph-corpus-discovery-report
          path: corpus-reports/
          if-no-files-found: ignore
