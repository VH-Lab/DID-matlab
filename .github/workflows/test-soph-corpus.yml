name: Soph (Griswold) corpus discovery

# On-demand discovery run for the Soph (Griswold) corpus -- the largest
# single-corpus fixture (~446 MB, ~101k v1 documents), which test-code.yml
# skips on every PR (testCorpusSoph is opt-in via DID_RUN_SOPH_TEST). This
# workflow sets DID_RUN_SOPH_TEST=1 and runs ONLY testCorpusSoph so we can
# verify the Griswold corpus converts to V_eta with no orphan docs / no
# unexpected quarantine, without re-running the ~1h50m full corpus suite.
# This is the orphan gate for the calculator un-deferral (a dissolved calc
# once produced 11448 Soph orphans; the id-preserving subject_calculation fold
# must keep it 0).
#
# Mirrors test-code.yml's environment (sibling did-schema checkout on the
# matching V_eta branch + assembled V_eta schema set).

on:
  # workflow_dispatch is only exposed for workflows on the default branch, so
  # while this lives on the feature branch it is driven by a scoped push
  # trigger: it re-runs only when the conversion engine, the Soph test, or this
  # workflow change -- not on unrelated pushes. Once merged to the default
  # branch, the workflow_dispatch entry below becomes the on-demand trigger and
  # the push block can be dropped.
  # PAUSED in test-code.yml's matrix 2026-10-25 (tools/corpus_matrix.py
  # PAUSED; Jess Haley: "Can we just stop running soph for now?"). This file is
  # the way to run Soph by hand: bump the token below and push, on any branch.
  push:
    paths:
      # NARROWED TO THIS FILE, 2026-08-10. It used to fire on
      # `src/did/+did2/+convert/**`, `testCorpusSoph.m` and `+helpers/**` --
      # i.e. on EVERY migrator change, for a corpus measured at 53 minutes.
      # During a session that touched migrators dozens of times that is hours
      # of runner time spent re-measuring one corpus.
      #
      # It also duplicates work: `test-corpus.yml`'s matrix ALREADY runs Soph,
      # with the same helpers and the same 0-orphan/0-quarantine gate, and
      # additionally writes the census report this one does not. So narrowing
      # here removes a second run of the same corpus, not a source of coverage.
      # Keep the file: its `did_schema_ref` input is a real capability the
      # matrix does not offer -- pointing Soph at a different did-schema branch.
      # To run Soph alone: bump the token below and push.
      #   soph-run-token: 2
      - '.github/workflows/test-soph-corpus.yml'
  workflow_dispatch:
    inputs:
      did_schema_ref:
        description: 'did-schema branch (V_eta line)'
        required: false
        default: ''
        type: string
      shards:
        # SESSION SHARDS. Soph stopped fitting in one 6-hour job (runs
        # 41094952761, 44030323541 and 44026343232 were cancelled at the limit;
        # the last full run to finish, 40635635248, took 4h35m). With N > 1
        # the corpus is cut into N shards of whole sessions
        # (tools/shard_corpus.py; sessions joined by a depends_on stay
        # together), one job per shard, each running the same test with the
        # same assertions over its shard. The union of the shards is the whole
        # corpus. Each report carries the shard manifest under `sample`, so a
        # shard's numbers cannot pass for the corpus's. 1 runs the whole
        # corpus in one job, as before.
        description: 'Number of whole-session shards (1 = the whole corpus in one job)'
        required: false
        default: '6'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: a push queues behind a run in progress instead of cancelling it.
  cancel-in-progress: false

jobs:
  select:
    name: "select shards"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      n: ${{ steps.pick.outputs.n }}
    steps:
      - id: pick
        shell: bash
        env:
          # A push carries no inputs: it shards too (one job no longer fits).
          RAW: ${{ inputs.shards || '6' }}
        run: |
          set -euo pipefail
          case "$RAW" in
            ''|*[!0-9]*) echo "::error::shards '$RAW' is not a whole number"; exit 1 ;;
          esac
          n=$((10#$RAW))
          if [ "$n" -lt 1 ] || [ "$n" -gt 20 ]; then
            echo "::error::shards must be 1..20, got $n"; exit 1
          fi
          m=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")
          echo "DENOMINATOR: $n shard(s) -> $m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "n=$n" >> "$GITHUB_OUTPUT"

  soph_corpus:
    needs: select
    name: "Soph (Griswold) corpus discovery${{ needs.select.outputs.n != '1' && format(' shard {0} of {1}', matrix.shard, needs.select.outputs.n) || '' }}"
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, whatever another shard does.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      DID_SCHEMA_REF: ${{ inputs.did_schema_ref || 'main' }}
      DID_RUN_SOPH_TEST: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_eta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ env.DID_SCHEMA_REF }}
          path: did-schema

      - name: Assemble the did_v2 schema set (did-schema main, no tiers)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # did-schema main's layout ([schema folders by family], Decided by Jess
          # Haley, 2026-10-30, did-schema did_v2_go_forward_class_audit.md): every
          # class file under schemas/did_v2/ at any depth (core classes at the top,
          # family subfolders, retiring/), plus the registries in schemas/registry/
          # and schemas/generated/, copied FLAT. There are no stable/, draft/ or
          # deprecated/ tiers ([one folder, final classes only]), and no
          # deprecated/*.json is copied ([retired classes leave V2] step 2, Jess
          # Haley, 2026-10-25): a tier folder fails the step, as do a basename held
          # twice and finding no class (tools/assemble_schema_set.py).
          python3 tools/assemble_schema_set.py did-schema/schemas "${GITHUB_WORKSPACE}/eta-schemas"

      - name: Check out NDI-matlab's v1 templates at the locked main
        # [carried v1 validates against NDI templates] (Decided by Jess Haley,
        # 2026-10-27, did-schema V_eta_go_forward_class_audit.md): a document
        # carried whole as v1 is validated against NDI-matlab's v1 templates at
        # the LOCKED NDI `main` (did-schema tools/sibling_lock.json), not
        # against did-schema's deprecated/ tombstones. Only the templates
        # folder is fetched, at that one commit. continue-on-error: without it
        # the check reports NOT CHECKED (summary.carried_v1_template_check);
        # it never turns a run red.
        continue-on-error: true
        run: |
          lock=did-schema/tools/sibling_lock.json
          if [ ! -f "$lock" ]; then echo "NO LOCK at $lock: the template check will say NOT CHECKED"; exit 0; fi
          sha=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['siblings']['NDI-matlab']['main'])" "$lock")
          echo "NDI-matlab locked main: $sha"
          dir="${GITHUB_WORKSPACE}/NDI-templates"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/VH-Lab/NDI-matlab.git
          git -C "$dir" sparse-checkout set src/ndi/ndi_common/database_documents
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$dir" checkout -q FETCH_HEAD
          t="$dir/src/ndi/ndi_common/database_documents"
          echo "templates: $(find "$t" -name '*.json' | wc -l) file(s) under $t"
          echo "DID_NDI_TEMPLATE_PATH=$t" >> "$GITHUB_ENV"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        env:
          # MatBox resolves mksqlite and vhlab-toolbox-matlab through the GitHub
          # API. UNAUTHENTICATED that is 60 requests/hour PER RUNNER IP, shared
          # across every job in flight -- so on a busy branch the gates start
          # failing on `GitHub API rate limit exceeded` in a step that has
          # nothing to do with the change under test. The error is indistinguishable
          # at a glance from a real dependency break, which is the expensive part.
          # secrets.GITHUB_TOKEN is minted per run by Actions, needs no setup, and
          # raises the limit to 1000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        env:
          # MatBox resolves mksqlite and vhlab-toolbox-matlab through the GitHub
          # API. UNAUTHENTICATED that is 60 requests/hour PER RUNNER IP, shared
          # across every job in flight -- so on a busy branch the gates start
          # failing on `GitHub API rate limit exceeded` in a step that has
          # nothing to do with the change under test. The error is indistinguishable
          # at a glance from a real dependency break, which is the expensive part.
          # secrets.GITHUB_TOKEN is minted per run by Actions, needs no setup, and
          # raises the limit to 1000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Cut Soph into whole-session shards (this job's shard)
        if: ${{ needs.select.outputs.n != '1' }}
        # Downloads the zip the test would, writes this job's shard where the
        # driver reads a cut corpus (DID_CORPUS_SAMPLE_DIR,
        # did2.unittest.helpers.sampledCorpus, which refuses to fall back to
        # the full corpus when the variable is set and the shard is missing).
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ needs.select.outputs.n }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/corpus-src"
          out="$RUNNER_TEMP/corpus-shard"
          mkdir -p "$src"
          curl -sSfL -o "$src/Soph.zip" \
            "https://ndi-programming-development.s3.us-east-1.amazonaws.com/Soph.zip"
          unzip -q "$src/Soph.zip" -d "$src"
          python3 -I tools/shard_corpus.py --corpus Soph --src "$src/Soph" \
              --out "$out" --shards "$NSHARDS" --index "$SHARD"
          rm -rf "$src"
          mkdir -p tests/corpus-reports
          cp "$out/Soph.sample.json" "tests/corpus-reports/Soph.shard.json"
          echo "DID_CORPUS_SAMPLE_DIR=$out" >> "$GITHUB_ENV"

      - name: Run the Soph corpus discovery test
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            results = runtests('did2.unittest.testCorpusSoph');
            disp(table(results));
            assertSuccess(results);

      - name: Upload Soph corpus discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soph-corpus-discovery-report${{ needs.select.outputs.n != '1' && format('-shard{0}-of-{1}', matrix.shard, needs.select.outputs.n) || '' }}
          # BOTH ROOTS, and `warn` not `ignore`: MATLAB's pwd here is `tests/`,
          # so a root-only path silently uploaded nothing.
          path: |
            corpus-reports/
            tests/corpus-reports/
          if-no-files-found: warn
