name: Test symmetry

on:
  push:
    branches: main

  pull_request:
    branches: main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-symmetry:
    name: Run symmetry tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install dependencies (mksqlite etc.)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run makeArtifacts tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tests_symmetry"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            import matlab.unittest.plugins.DiagnosticsOutputPlugin;
            runner = TestRunner.withTextOutput;
            makeSuite = TestSuite.fromPackage("did.symmetry.makeArtifacts", "IncludingSubpackages", true);
            makeResults = runner.run(makeSuite);
            disp(table(makeResults));
            assert(all([makeResults.Passed]), "makeArtifacts tests failed");

      - name: Run readArtifacts tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tests_symmetry"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            import matlab.unittest.selectors.HasParameter;
            runner = TestRunner.withTextOutput;
            readSuite = TestSuite.fromPackage("did.symmetry.readArtifacts", "IncludingSubpackages", true);
            % The readArtifacts suite is parameterized over
            % SourceType = {matlabArtifacts, pythonArtifacts}. This workflow is
            % the MATLAB half of the pair: it runs no Python, so pythonArtifacts
            % is never generated here and that leg could only ever skip. Reading
            % Python's artifacts belongs to DID-python's "Cross-Language
            % Symmetry Tests" workflow, which checks out BOTH repos and runs the
            % full round trip (MATLAB makeArtifacts -> Python make + read ->
            % MATLAB read, both legs). Deselect the leg this job cannot produce,
            % rather than asserting on a variant that structurally cannot run.
            % Negated (rather than selecting matlabArtifacts) so a future
            % unparameterized readArtifacts test is not silently dropped.
            readSuite = readSuite.selectIf(~HasParameter("Property", "SourceType", "Name", "pythonArtifacts"));
            readResults = runner.run(readSuite);
            disp(table(readResults));
            nSkipped = sum([readResults.Incomplete]);
            nPassed = sum([readResults.Passed]);
            nFailed = sum([readResults.Failed]);
            fprintf("Results: %d passed, %d failed, %d skipped\n", nPassed, nFailed, nSkipped);
            assert(nFailed == 0, "readArtifacts tests failed");
            % With the pythonArtifacts leg deselected above, every variant left
            % in this suite is one this job produces itself, so a skip here is a
            % real regression -- MATLAB failing to read back its own artifacts.
            % The gate previously asserted only on nFailed, which let an
            % all-skipped run report green. Require at least one pass as well, so
            % an empty suite cannot slip through either.
            assert(nSkipped == 0, "readArtifacts had skipped (Incomplete) variants - a MATLAB leg did not run");
            assert(nPassed > 0, "readArtifacts ran no passing tests");
