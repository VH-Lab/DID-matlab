name: Test symmetry

on:
  push:
    branches: main

  pull_request:
    branches: main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-symmetry:
    name: Run symmetry tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install dependencies (mksqlite etc.)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run makeArtifacts tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tests_symmetry"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            import matlab.unittest.plugins.DiagnosticsOutputPlugin;
            runner = TestRunner.withTextOutput;
            makeSuite = TestSuite.fromPackage("did.symmetry.makeArtifacts", "IncludingSubpackages", true);
            makeResults = runner.run(makeSuite);
            disp(table(makeResults));
            assert(all([makeResults.Passed]), "makeArtifacts tests failed");

      - name: Run readArtifacts tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tests_symmetry"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            runner = TestRunner.withTextOutput;
            readSuite = TestSuite.fromPackage("did.symmetry.readArtifacts", "IncludingSubpackages", true);
            readResults = runner.run(readSuite);
            disp(table(readResults));
            % Same verdict block as the other gates, so a red run names the test.
            % NOTE the assert here deliberately does NOT gate on n_run: this suite
            % legitimately skips (nSkipped is reported and tolerated), and whether
            % it can select zero tests has not been measured. Gating on it would be
            % a guess dressed as a check.
            verdict = struct('n_run', numel(readResults), ...
                'n_failed', sum([readResults.Failed]));
            try
                verdict = did2.unittest.helpers.reportVerdict(readResults, "readArtifacts");
            catch verdictErr
                fprintf(2, "reportVerdict itself failed (%s) -- falling back to counts only\n", ...
                    verdictErr.message);
            end
            assert(verdict.n_failed == 0, ...
                "readArtifacts tests failed -- names are in the VERDICT block above");
