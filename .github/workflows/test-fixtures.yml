name: Fixture corpus (fast validate)

# The edit-loop validation gate: runs a SMALL self-contained set of v1 fixtures
# through the full V_eta migration pipeline WITH schema validation on, asserting
# 0 quarantine + 0 orphans -- the same gates as the ~2-hour full corpus
# (test-code.yml), but in a couple of minutes. Use this to validate a migrator or
# schema change quickly; the full corpus stays the milestone gate.

on:
  push:
    branches: [main, V2, 'claude/**']
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main, V2]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  # Keyed on the commit: a push never cancels another commit's run;
  # only a duplicate run of the same commit is cancelled.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  fixture-corpus:
    name: Fixture corpus (fast validate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_eta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          # V_eta lives on did-schema `main` since #64 merged (2026-09-23) and
          # the shared topic branch was deleted. Validate against main.
          ref: main  # did-schema #88 merged into main 2026-10-23: see test-code.yml
          path: did-schema

      - name: Assemble V_eta schema set (stable + draft)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # DEPRECATED IS PART OF THE VALIDATION SET, even though it is not part
          # of the go-forward MODEL. Those are two different questions and they
          # were conflated here until 2026-08-10.
          #
          # `deprecated/` holds exactly the v1 shapes that DELIBERATELY pass
          # through unmodelled -- projectvar, stimulus_parameter_table,
          # image_stack(+_parameters). A passthrough's whole contract is that the
          # document reaches the validator under its own class, so omitting the
          # tier means every one of them QUARANTINES. The tier was doing nothing.
          #
          # It went unnoticed because three of the four have never appeared in a
          # tested corpus. The fourth did: corpus run 31421715133 turned 4,563 JH
          # `image_stack` documents into `No schema file for class "image_stack"`
          # the moment the guard made them passthroughs instead of subject-less
          # observations. Trading silent husks for loud quarantines was the point
          # of the guard; losing them at validation was not.
          #
          # Safe to copy: no filename collides across tiers (checked, 245 files).
          # [schema set renamed did_v2] (Jess Haley, 2026-10-25), step 1: the set's
          # new name when did-schema has it, else V_eta; and [retired classes leave
          # V2]: a set with no deprecated/ tier is not an error.
          SET=did-schema/schemas/V_eta
          if [ -d did-schema/schemas/did_v2 ]; then SET=did-schema/schemas/did_v2; fi
          echo "schema set: $SET"
          # [one folder, final classes only] (Decided by Jess Haley, 2026-10-29,
          # did-schema V_eta_go_forward_class_audit.md): every V2 class moves into
          # one folder, $SET/*.json, with no stable/ or draft/ tier, and the
          # siblings read the flat layout first. Both layouts are read: each tier
          # when it exists, and every class file at the set's top level (index.json
          # and topics.json there are the set's index, not classes).
          DEST="${GITHUB_WORKSPACE}/eta-schemas/"
          for tier in stable draft; do
            if [ -d "$SET/$tier" ]; then cp "$SET/$tier"/*.json "$DEST"; fi
          done
          for f in "$SET"/*.json; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in index.json|topics.json) continue ;; esac
            cp "$f" "$DEST"
          done
          if ! ls "$DEST"/*.json >/dev/null 2>&1; then echo "::error::no schema files found in $SET (flat or tiered)"; exit 1; fi
          if [ -d "$SET/deprecated" ]; then cp "$SET"/deprecated/*.json "${GITHUB_WORKSPACE}/eta-schemas/"; fi

      - name: Check out NDI-matlab's v1 templates at the locked main
        # [carried v1 validates against NDI templates] (Decided by Jess Haley,
        # 2026-10-27, did-schema V_eta_go_forward_class_audit.md): a document
        # carried whole as v1 is validated against NDI-matlab's v1 templates at
        # the LOCKED NDI `main` (did-schema tools/sibling_lock.json), not
        # against did-schema's deprecated/ tombstones. Only the templates
        # folder is fetched, at that one commit. continue-on-error: without it
        # the check reports NOT CHECKED (summary.carried_v1_template_check);
        # it never turns a run red.
        continue-on-error: true
        run: |
          lock=did-schema/tools/sibling_lock.json
          if [ ! -f "$lock" ]; then echo "NO LOCK at $lock: the template check will say NOT CHECKED"; exit 0; fi
          sha=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['siblings']['NDI-matlab']['main'])" "$lock")
          echo "NDI-matlab locked main: $sha"
          dir="${GITHUB_WORKSPACE}/NDI-templates"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/VH-Lab/NDI-matlab.git
          git -C "$dir" sparse-checkout set src/ndi/ndi_common/database_documents
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$dir" checkout -q FETCH_HEAD
          t="$dir/src/ndi/ndi_common/database_documents"
          echo "templates: $(find "$t" -name '*.json' | wc -l) file(s) under $t"
          echo "DID_NDI_TEMPLATE_PATH=$t" >> "$GITHUB_ENV"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        env:
          # MatBox resolves mksqlite and vhlab-toolbox-matlab through the GitHub
          # API. UNAUTHENTICATED that is 60 requests/hour PER RUNNER IP, shared
          # across every job in flight -- so on a busy branch the gates start
          # failing on `GitHub API rate limit exceeded` in a step that has
          # nothing to do with the change under test. The error is indistinguishable
          # at a glance from a real dependency break, which is the expensive part.
          # secrets.GITHUB_TOKEN is minted per run by Actions, needs no setup, and
          # raises the limit to 1000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        env:
          # MatBox resolves mksqlite and vhlab-toolbox-matlab through the GitHub
          # API. UNAUTHENTICATED that is 60 requests/hour PER RUNNER IP, shared
          # across every job in flight -- so on a busy branch the gates start
          # failing on `GitHub API rate limit exceeded` in a step that has
          # nothing to do with the change under test. The error is indistinguishable
          # at a glance from a real dependency break, which is the expensive part.
          # secrets.GITHUB_TOKEN is minted per run by Actions, needs no setup, and
          # raises the limit to 1000/hour for this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run fixture corpus + migrator unit tests (fast, validation on)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            % testFixtureCorpus: full-pipeline schema validation (0 quarantine/orphan).
            % testMigratorsJ: per-migrator STRUCTURAL assertions (the shapes the
            % schema check can't see) -- both are corpus-free and run in seconds, so
            % they belong on the fast gate together.
            results = runtests(["did2.unittest.testFixtureCorpus", ...
                                "did2.unittest.testMigratorsJ"]);
            disp(table(results));
            % THE VERDICT BLOCK PRINTS LAST so a red run is readable from a log
            % tail: the failing test's NAME, not just a count. This workflow was
            % the ONE of four asserting on `results.Failed` that never got it --
            % and on 2026-08-11 it failed with exactly "1 fast-gate test(s)
            % failed" and nothing else, so finding which test meant scrolling a
            % 1,363-line log for the row whose flags read `false true false`.
            % A count is not a diagnosis.
            %
            % Guarded, because a helper that fails to resolve must not turn every
            % gate red: the fallback recomputes the same two numbers and says
            % loudly that it did.
            verdict = struct('n_run', numel(results), ...
                'n_failed', sum([results.Failed]));
            try
                verdict = did2.unittest.helpers.reportVerdict(results, "fast gate");
            catch verdictErr
                fprintf(2, "reportVerdict itself failed (%s) -- falling back to counts only\n", ...
                    verdictErr.message);
            end
            assert(verdict.n_run > 0, ...
                "the suite selected NO tests -- that is a broken filter, not a pass");
            assert(verdict.n_failed == 0, ...
                sprintf("%d fast-gate test(s) failed -- names are in the VERDICT block above", ...
                    verdict.n_failed));
