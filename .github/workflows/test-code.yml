name: Test code

on:
  push:
    branches: [main, V2]
    paths-ignore:
      - '*.md'
      - '.github/**'

  pull_request:
    branches: [main, V2]
    paths-ignore:
      - '*.md'
      - '.github/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-code:
    # Flat workflow modeled on NDI-matlab/.github/workflows/run-tests.yml.
    # Order matters: check-code runs immediately after install-matbox,
    # before any other step touches the MATLAB path. An earlier ordering
    # that ran matbox.installRequirements() first made check-code fail
    # with "codecheckToolbox: Too many input arguments" even on
    # release: latest. installRequirements is moved after check-code
    # since the tests need mksqlite + vhlab-toolbox-matlab but the
    # static analysis does not.
    name: Analyse and test code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_eta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          # Track the matching did-schema V_eta (Brainstorm-J) branch: the
          # bare-identity subject, subject_statement `parameters` (D10),
          # session_bounded_reference + directed_relation time_reference (D10
          # multi-party binding), the strict-J leaf tier, etc. live on this
          # branch and are not yet on did-schema main. The three repos share the
          # branch name, so off-PR (push / workflow_dispatch, where head_ref is
          # empty) track the same-named did-schema branch via ref_name; that
          # resolves to `main` for base-branch runs.
          ref: ${{ github.head_ref || github.ref_name }}
          path: did-schema

      - name: Assemble V_eta schema set (stable + draft)
        # V_eta (Brainstorm J) is the migration/validation target. The schema
        # cache loads a single flat dir of *.json; the Brainstorm-J classes live
        # in V_eta/stable and the genomics/dataseries data-format families in
        # V_eta/draft (class names are disjoint across tiers), so combine both
        # tiers into one directory for DID_SCHEMA_PATH.
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          cp did-schema/schemas/V_eta/stable/*.json "${GITHUB_WORKSPACE}/eta-schemas/"
          cp did-schema/schemas/V_eta/draft/*.json  "${GITHUB_WORKSPACE}/eta-schemas/"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" \
            >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Check code
        uses: ehennestad/matbox-actions/check-code@v1
        with:
          source_directory: 'src'

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        uses: matlab-actions/run-command@v2
        if: always()
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run tests
        uses: matlab-actions/run-command@v2
        if: always()
        env:
          # Opt in to the ~446 MB Soph corpus (the largest fixture, ~101k v1
          # docs). It is skipped by default to keep PR runs cheap; the full
          # test-code run validates the entire corpus at V_eta, so include it.
          DID_RUN_SOPH_TEST: '1'
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            runner = TestRunner.withTextOutput;
            % did2 self-tests live under tests/+did2/+unittest/ now (the
            % legacy +did/+unittest/ layout). TestSuite.fromPackage with
            % IncludingSubpackages=true picks up the function-based test
            % files and any future +abstract base classes. Mirrors the
            % discovery pattern in test-symmetry.yml.
            suite = TestSuite.fromPackage("did2.unittest", "IncludingSubpackages", true);
            results = runner.run(suite);
            disp(table(results));
            nFailed = sum([results.Failed]);
            assert(nFailed == 0, sprintf("%d test(s) failed", nFailed));

      - name: Corpus census digest (END OF LOG -- reachable by a log tail)
        # The corpus tests already print every number below, but they run FIRST
        # in a ~1700-line, 2.5-hour log, so the census is unreachable by a log
        # tail and effectively write-only: reading it meant downloading the
        # artifact. This step re-prints the same figures from the saved JSON at
        # the very END, where `get_job_logs --tail` lands.
        #
        # This is not decoration. The silent-loss census is the evidence that
        # gates Phase 1: `mustBeNonEmpty` on depends_on and the all-blank
        # composite check cannot be flipped to enforcing until these counts are
        # known, because flipping blind would light up an unknown number of
        # quarantines and block the 0-quarantine gate.
        #
        # BOTH ROOTS. MATLAB's pwd during these corpora is `tests/`, so the
        # reports land in `tests/corpus-reports/` and this step -- which named
        # only the repo-root path -- has been printing NO REPORTS FOUND while
        # exiting 0. The digest now fails loudly when it aggregates nothing.
        if: always()
        run: python3 tools/census_digest.py corpus-reports tests/corpus-reports

      - name: Upload corpus discovery reports
        # Discovery-mode corpus tests (e.g., testCorpus20211116) write
        # JSON summaries into corpus-reports/. Upload them as a CI
        # artifact regardless of test outcome so the migrated/quarantine
        # signal survives the run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-discovery-reports
          path: |
            corpus-reports/
            tests/corpus-reports/
          if-no-files-found: warn
