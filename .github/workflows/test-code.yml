name: Test code

on:
  push:
    branches: [main, V2]
    paths-ignore:
      - '*.md'
      - '.github/**'

  pull_request:
    branches: [main, V2]
    paths-ignore:
      - '*.md'
      - '.github/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-code:
    # Flat workflow modeled on NDI-matlab/.github/workflows/run-tests.yml.
    # Order matters: check-code runs immediately after install-matbox,
    # before any other step touches the MATLAB path. An earlier ordering
    # that ran matbox.installRequirements() first made check-code fail
    # with "codecheckToolbox: Too many input arguments" even on
    # release: latest. installRequirements is moved after check-code
    # since the tests need mksqlite + vhlab-toolbox-matlab but the
    # static analysis does not.
    name: Analyse and test code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_eta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          # Track the matching did-schema V_eta (Brainstorm-J) branch: the
          # bare-identity subject, subject_statement `parameters` (D10),
          # session_bounded_reference + directed_relation time_reference (D10
          # multi-party binding), the strict-J leaf tier, etc. live on this
          # branch and are not yet on did-schema main. The three repos share the
          # branch name, so off-PR (push / workflow_dispatch, where head_ref is
          # empty) track the same-named did-schema branch via ref_name; that
          # resolves to `main` for base-branch runs.
          ref: ${{ github.head_ref || github.ref_name }}
          path: did-schema

      - name: Assemble V_eta schema set (stable + draft)
        # V_eta (Brainstorm J) is the migration/validation target. The schema
        # cache loads a single flat dir of *.json; the Brainstorm-J classes live
        # in V_eta/stable and the genomics/dataseries data-format families in
        # V_eta/draft (class names are disjoint across tiers), so combine both
        # tiers into one directory for DID_SCHEMA_PATH.
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          cp did-schema/schemas/V_eta/stable/*.json "${GITHUB_WORKSPACE}/eta-schemas/"
          cp did-schema/schemas/V_eta/draft/*.json  "${GITHUB_WORKSPACE}/eta-schemas/"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" \
            >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Check code
        uses: ehennestad/matbox-actions/check-code@v1
        with:
          source_directory: 'src'

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        uses: matlab-actions/run-command@v2
        if: always()
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: Run tests
        uses: matlab-actions/run-command@v2
        if: always()
        env:
          # Opt in to the ~446 MB Soph corpus (the largest fixture, ~101k v1
          # docs). It is skipped by default to keep PR runs cheap; the full
          # test-code run validates the entire corpus at V_eta, so include it.
          DID_RUN_SOPH_TEST: '1'
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            runner = TestRunner.withTextOutput;
            % did2 self-tests live under tests/+did2/+unittest/ now (the
            % legacy +did/+unittest/ layout). TestSuite.fromPackage with
            % IncludingSubpackages=true picks up the function-based test
            % files and any future +abstract base classes. Mirrors the
            % discovery pattern in test-symmetry.yml.
            suite = TestSuite.fromPackage("did2.unittest", "IncludingSubpackages", true);
            results = runner.run(suite);
            disp(table(results));
            nFailed = sum([results.Failed]);
            assert(nFailed == 0, sprintf("%d test(s) failed", nFailed));

      - name: Corpus census digest (END OF LOG -- reachable by a log tail)
        # The corpus tests already print every number below, but they run FIRST
        # in a ~1700-line, 2.5-hour log, so the census is unreachable by a log
        # tail and effectively write-only: reading it meant downloading the
        # artifact. This step re-prints the same figures from the saved JSON at
        # the very END, where `get_job_logs --tail` lands.
        #
        # This is not decoration. The silent-loss census is the evidence that
        # gates Phase 1: `mustBeNonEmpty` on depends_on and the all-blank
        # composite check cannot be flipped to enforcing until these counts are
        # known, because flipping blind would light up an unknown number of
        # quarantines and block the 0-quarantine gate.
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob, os, traceback
          files = sorted(glob.glob('corpus-reports/*-summary.json'))
          if not files:
              print('NO CORPUS REPORTS FOUND (corpus-reports/*-summary.json)')
              raise SystemExit(0)

          def aslist(v):
              # MATLAB's jsonencode writes a 1-ELEMENT struct array as a bare
              # object, not a 1-element array. So a report listing several
              # offending edges arrives as a list, and one listing exactly one
              # arrives as a dict -- and `dict[:10]` raises
              # `KeyError: slice(None, 10, None)`. That killed the digest
              # mid-corpus on run #256 and cost the two largest corpora their
              # output, after a 2h49m run.
              if v is None: return []
              if isinstance(v, dict): return [v]
              if isinstance(v, list): return v
              return [v]

          failures = []
          print('=' * 72)
          print('CORPUS CENSUS DIGEST  (%d corpus report(s))' % len(files))
          print('=' * 72)
          for p in files:
              try:
                  r = json.load(open(p))
              except Exception as e:
                  print('\n%s: UNREADABLE (%s)' % (p, e))
                  failures.append(p)
                  continue
              name = r.get('corpus', os.path.basename(p))
              try:
                  print('\n--- %s ---' % name)
                  print('  total=%s  migrated=%s  quarantine=%s' % (
                      r.get('total','?'), r.get('migrated_count','?'),
                      r.get('quarantine_count','?')))
                  sl = r.get('silent_loss') or {}
                  if 'audit_failed' in sl:
                      print('  silent-loss: AUDIT FAILED (%s)' % sl['audit_failed'])
                  elif sl:
                      # total_docs/skipped_docs FIRST, and unconditionally. Without
                      # them a census that inspected nothing prints "0 empty edges,
                      # 0 vacuous fields" -- byte-identical to a clean result. That
                      # is the exact bug silentLoss itself shipped with (asStruct
                      # asked for a property did2.document does not have, so every
                      # document was dropped and the zeros read as good news for two
                      # days). A digest that omits the denominator recreates it one
                      # layer up.
                      td = sl.get('total_docs', '?')
                      print('  silent-loss: inspected %s doc(s), skipped %s'
                            % (td, sl.get('skipped_docs', '?')))
                      if td == 0:
                          print('  *** total_docs=0 -- THE CENSUS INSPECTED NOTHING. The counts')
                          print('  *** below are vacuous; do NOT read them as a clean result.')
                      elif isinstance(td, int) and sl.get('skipped_docs', 0) == td:
                          print('  *** every document was skipped -- counts below are vacuous.')
                      print('  silent-loss: %s empty required edge(s), %s vacuous required field(s)'
                            % (sl.get('empty_dependency_count','?'),
                               sl.get('vacuous_field_count','?')))
                      for e in aslist(sl.get('empty_required_dependency'))[:10]:
                          print('      %8s  %s.%s' % (e.get('count','?'),
                                e.get('class_name','?'), e.get('edge_name','?')))
                      for f in aslist(sl.get('vacuous_required_field'))[:10]:
                          print('      %8s  %s / %s.%s' % (f.get('count','?'),
                                f.get('class_name','?'), f.get('block','?'),
                                f.get('field_name','?')))
                  if 'fragment_count' in r:
                      fc = r['fragment_count']
                      print('  FRAGMENTS: %s migration(s) emitted only scaffolding%s'
                            % (fc, '  <-- payload dropped, invisible to every other counter' if fc else ''))
                      for k, v in sorted((r.get('fragment_by_class') or {}).items(),
                                         key=lambda kv: -kv[1])[:15]:
                          print('      %8s  %s' % (v, k))
                  if 'unconverted_count' in r:
                      print('  unconverted: %s document(s) returned unchanged' % r['unconverted_count'])
                      ubc = r.get('unconverted_by_class') or {}
                      for k, v in sorted(ubc.items(), key=lambda kv: -kv[1])[:15]:
                          print('      %8s  %s' % (v, k))
                  for q in aslist(r.get('quarantine_reasons'))[:5]:
                      print('  quarantine: %5s [%s] %s' % (q.get('count','?'),
                            q.get('class_name','?'), str(q.get('reason',''))[:90]))
              except Exception:
                  print("  *** DIGEST FAILED for this corpus -- the numbers above are"
                        " partial. Traceback:")
                  traceback.print_exc()
                  failures.append(p)
          print('\n' + '=' * 72)
          if failures:
              # Still fail the step -- a digest that cannot read its input must
              # say so -- but only AFTER every readable corpus has printed.
              print('DIGEST FAILED on %d of %d report(s): %s'
                    % (len(failures), len(files), ', '.join(failures)))
              raise SystemExit(1)
          PY

      - name: Upload corpus discovery reports
        # Discovery-mode corpus tests (e.g., testCorpus20211116) write
        # JSON summaries into corpus-reports/. Upload them as a CI
        # artifact regardless of test outcome so the migrated/quarantine
        # signal survives the run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-discovery-reports
          path: corpus-reports/
          if-no-files-found: ignore
