name: Run Codespell

on:
  push:
    branches: [ "main", "V2" ]

  pull_request:
    branches: [ "main", "V2" ]

  workflow_dispatch:

concurrency:
  # Keyed on the commit: a push never cancels another commit's run;
  # only a duplicate run of the same commit is cancelled.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Run Codespell action
        uses: codespell-project/actions-codespell@v2
