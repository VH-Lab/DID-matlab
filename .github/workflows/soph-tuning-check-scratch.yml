name: Soph tuning check (scratch)

# Scratch, on branch claude/soph-tuning-check-1111 only; never merged. Answers
# one question: on DID-matlab V2 (cd0c4212) against did-schema main, do Soph's
# tuning calculators still quarantine? (Shard run 42930799742, on base 359a0563,
# quarantined 5,240 in shard 1.) Soph routine runs are paused (Jess Haley); this
# runs only shards 1 and 3 of tools/shard_corpus.py's 6 (the two with the most
# contrasttuning/oridirtuning/contrastsensitivity calculators, from run
# 42934917924's COUNT4 lines).

on:
  push:
    branches: ['claude/soph-tuning-check-1111']
    paths:
      - '.github/workflows/soph-tuning-check-scratch.yml'
  workflow_dispatch:

jobs:
  check:
    name: "Soph shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Check out did-schema main
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: main
          path: did-schema
      - name: Print shas
        run: |
          echo "did-schema checked out: $(git -C did-schema rev-parse HEAD); DID-matlab: $(git rev-parse HEAD)"
      - name: Assemble schema set
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          python3 tools/assemble_schema_set.py did-schema/schemas "${GITHUB_WORKSPACE}/eta-schemas"
      - name: Check out NDI-matlab's v1 templates at the locked main
        continue-on-error: true
        run: |
          lock=did-schema/tools/sibling_lock.json
          if [ ! -f "$lock" ]; then echo "NO LOCK"; exit 0; fi
          sha=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['siblings']['NDI-matlab']['main'])" "$lock")
          echo "NDI-matlab locked main: $sha"
          dir="${GITHUB_WORKSPACE}/NDI-templates"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/VH-Lab/NDI-matlab.git
          git -C "$dir" sparse-checkout set src/ndi/ndi_common/database_documents
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "DID_NDI_TEMPLATE_PATH=$dir/src/ndi/ndi_common/database_documents" >> "$GITHUB_ENV"
      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Install MatBox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ehennestad/matbox-actions/install-matbox@v1
      - name: Install repo dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());
      - name: "Shard Soph (whole sessions, 6 shards)"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          curl -sSfL -o "$RUNNER_TEMP/src/Soph.zip" "https://ndi-programming-development.s3.us-east-1.amazonaws.com/Soph.zip"
          unzip -q "$RUNNER_TEMP/src/Soph.zip" -d "$RUNNER_TEMP/src"
          python3 -I tools/shard_corpus.py --src "$RUNNER_TEMP/src/Soph" --out "$RUNNER_TEMP/shard/Soph" \
            --shards 6 --index ${{ matrix.shard }}
          echo "COUNTS_CORPUS_DIR=$RUNNER_TEMP/shard/Soph" >> "$GITHUB_ENV"
      - name: "Migrate Soph shard"
        uses: matlab-actions/run-command@v2
        env:
          DID_RUN_SOPH_TEST: "1"
          COUNTS_CORPUS: Soph
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            addpath(genpath("tools"));
            setenv("COUNTS_DUMP", fullfile(getenv("RUNNER_TEMP"), "counts-dump"));
            runner = matlab.unittest.TestRunner.withTextOutput;
            results = runner.run(matlab.unittest.TestSuite.fromFile(fullfile("tools","testCorpusCountsDump.m")));
            disp(table(results));
      - name: Upload quarantine tally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soph-tuning-check-shard${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/counts-dump/quarantine_reasons.json
            ${{ runner.temp }}/counts-dump/source_outputs.json
          retention-days: 7
          if-no-files-found: warn
