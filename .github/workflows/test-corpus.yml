name: Corpus (parallel)

# WHY THIS EXISTS
#
# test-code.yml runs every corpus SERIALLY inside one MATLAB process. Run #256
# took 2h49m, and a bug in its final reporting step cost the two largest corpora
# their output -- so recovering a REPORTING defect required re-running 2h49m of
# migration. A feedback loop that long is the primary brake on this project.
#
# Each corpus downloads its own fixture from S3 and is an independent test file,
# so there is no reason to run them one after another. This workflow fans them
# out: wall-clock becomes the slowest SINGLE corpus (Soph, ~446 MB / ~101k docs)
# instead of the sum of all six, and a failure in one corpus no longer hides the
# other five.
#
# The census digest is its own job that runs after the fan-out with `if:
# always()`, so it reports on whatever corpora finished even when one fails.
#
# Deliberately a SEPARATE workflow file from test-code.yml: a shared
# `concurrency` group keyed on the workflow name would make dispatching this one
# cancel an in-flight test-code run.

on:
  # workflow_dispatch cannot reach a workflow that does not yet exist on the
  # DEFAULT branch -- the API 404s. Until this merges, a push trigger scoped to
  # this file is the only way to exercise it. Deliberately narrow: it fires when
  # the workflow itself changes, NOT on every source push, so validating the
  # pipeline does not spend six MATLAB runners on unrelated commits.
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/test-corpus.yml"
      - "tools/census_digest.py"
  workflow_dispatch:
  schedule:
    # 07:00 UTC daily. The full corpus is the slow, thorough gate; PRs are
    # served by test-migrators-quick.yml (~2 min).
    - cron: "0 7 * * *"

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: "corpus: ${{ matrix.corpus }}"
    runs-on: ubuntu-latest
    strategy:
      # One corpus failing must not cancel the others -- the whole point is to
      # see every corpus's numbers in one pass.
      fail-fast: false
      matrix:
        corpus: ["20211116", "B", "Dab", "JH", "PRED", "Soph"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out did-schema (sibling, for V_eta validation)
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/did-schema
          ref: ${{ github.head_ref || github.ref_name }}
          path: did-schema

      - name: Assemble V_eta schema set (stable + draft)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/eta-schemas"
          # DEPRECATED IS PART OF THE VALIDATION SET, even though it is not part
          # of the go-forward MODEL. Those are two different questions and they
          # were conflated here until 2026-08-10.
          #
          # `deprecated/` holds exactly the v1 shapes that DELIBERATELY pass
          # through unmodelled -- projectvar, stimulus_parameter_table,
          # image_stack(+_parameters). A passthrough's whole contract is that the
          # document reaches the validator under its own class, so omitting the
          # tier means every one of them QUARANTINES. The tier was doing nothing.
          #
          # It went unnoticed because three of the four have never appeared in a
          # tested corpus. The fourth did: corpus run 31421715133 turned 4,563 JH
          # `image_stack` documents into `No schema file for class "image_stack"`
          # the moment the guard made them passthroughs instead of subject-less
          # observations. Trading silent husks for loud quarantines was the point
          # of the guard; losing them at validation was not.
          #
          # Safe to copy: no filename collides across tiers (checked, 245 files).
          cp did-schema/schemas/V_eta/stable/*.json "${GITHUB_WORKSPACE}/eta-schemas/"
          cp did-schema/schemas/V_eta/draft/*.json  "${GITHUB_WORKSPACE}/eta-schemas/"
          cp did-schema/schemas/V_eta/deprecated/*.json "${GITHUB_WORKSPACE}/eta-schemas/"

      - name: Export DID_SCHEMA_PATH
        run: |
          echo "DID_SCHEMA_PATH=${GITHUB_WORKSPACE}/eta-schemas" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Install repo dependencies (mksqlite, vhlab-toolbox-matlab)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tools"));
            matbox.installRequirements(didtools.projectdir());

      - name: "Run corpus ${{ matrix.corpus }}"
        uses: matlab-actions/run-command@v2
        env:
          # Soph is opt-in behind this flag. Harmless for the other corpora.
          DID_RUN_SOPH_TEST: "1"
        with:
          command: |
            addpath(genpath("src"));
            addpath(genpath("tests"));
            import matlab.unittest.TestRunner;
            import matlab.unittest.TestSuite;
            runner = TestRunner.withTextOutput;
            suite = TestSuite.fromFile( ...
                fullfile("tests","+did2","+unittest","testCorpus${{ matrix.corpus }}.m"));
            results = runner.run(suite);
            disp(table(results));
            nFailed = sum([results.Failed]);
            assert(nFailed == 0, sprintf("%d test(s) failed", nFailed));

      - name: "Upload ${{ matrix.corpus }} report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ matrix.corpus }}
          # BOTH PATHS, and `warn` not `ignore`. The reports are written to
          # `pwd/corpus-reports/`, and MATLAB's pwd during these runs is the
          # REPO ROOT for some entry points and `tests/` for others -- the log
          # says `.../DID-matlab/tests/corpus-reports/Soph-summary.json`. The
          # upload looked only at the root, found nothing, and said so quietly:
          #
          #   No files were found with the provided path: corpus-reports/.
          #   ...
          #   Census digest: Found 0 artifact(s) -- NO CORPUS REPORTS FOUND
          #
          # Six corpora ran for over an hour, every job went green, and the
          # digest that four open items depend on aggregated NOTHING. The
          # numbers survived only in stdout. `ignore` is what made it quiet;
          # `warn` annotates the run instead.
          path: |
            corpus-reports/
            tests/corpus-reports/
          if-no-files-found: warn

  census:
    name: Census digest
    needs: corpus
    # Report on whatever finished. A corpus that failed still tells us
    # something, and one red corpus must not suppress the other five.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download every corpus report
        uses: actions/download-artifact@v4
        with:
          pattern: corpus-report-*
          merge-multiple: true
          path: corpus-reports
        continue-on-error: true

      - name: Corpus census digest
        # The digest searches RECURSIVELY and exits non-zero when it finds
        # nothing. Both properties are load-bearing: `upload-artifact` given
        # two search paths roots the zip at their least common ancestor (the
        # repo root), so the download lands the reports at
        # `corpus-reports/tests/corpus-reports/` -- one level below where the
        # old one-level glob looked. Run #3 downloaded 5 artifacts, wrote 10
        # files, printed "NO CORPUS REPORTS FOUND" and went GREEN.
        run: python3 tools/census_digest.py corpus-reports tests/corpus-reports

      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-discovery-reports
          path: corpus-reports/
          if-no-files-found: ignore
